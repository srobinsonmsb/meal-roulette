[project]
name = "meal-roulette"
version = "0.3.0"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["Flask>=3.1,<3.2", "python-dotenv>=1,<2", "waitress>=3.0,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
calendar = ["google-api-python-client>=2,<3", "google-auth-httplib2>=0.2,<1", "google-auth-oauthlib>=1,<2"]
migration = ["psycopg2-binary>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
